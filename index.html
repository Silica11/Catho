<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>US Digitali - ArcheoApp</title>
    <style>
        :root {
            --primary-pink: #fce4ec;
            --accent-pink: #f06292;
            --dark-text: #4a4a4a;
            --white: #ffffff;
            --bg-color: #fff5f8;
        }

        /* Impedisce il ricaricamento trascinando verso il basso */
        html, body { 
            overscroll-behavior-y: contain; 
            overflow: hidden;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        /* BARRA SUPERIORE */
        .header-container { width: 100%; max-width: 500px; margin-bottom: 20px; }
        
        .top-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 10px;
        }

        .back-btn {
            display: none; /* Gestito da JS */
            align-items: center; justify-content: center;
            background: var(--white); color: var(--accent-pink);
            border: 2px solid var(--primary-pink); border-radius: 50%;
            width: 35px; height: 35px; cursor: pointer;
            font-size: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .breadcrumb { 
            font-size: 14px; color: var(--dark-text); 
            font-weight: 500; opacity: 0.8; margin-bottom: 10px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .breadcrumb b { color: var(--accent-pink); opacity: 1; }

        .search-bar { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; background: var(--white); box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 16px; outline: none; box-sizing: border-box; margin-bottom: 10px;}
        
        /* BARRA COMPILATORE (MENU A TENDINA PULITO) */
        .compiler-bar {
            width: 100%; background: var(--white); border: 2px solid var(--primary-pink);
            border-radius: 20px; padding: 10px 15px; display: flex; justify-content: space-between;
            align-items: center; box-sizing: border-box; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            margin-bottom: 15px; transition: border-color 0.2s;
        }
        .compiler-bar:active { border-color: var(--accent-pink); }
        .compiler-label { font-size: 12px; color: gray; font-weight: bold; text-transform: uppercase; }
        .compiler-name { font-size: 15px; color: var(--accent-pink); font-weight: bold; }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; padding-bottom: 100px; }

        /* BOX NORMALI */
        .box {
            background: var(--white); padding: 20px 15px; border-radius: 20px; text-align: center;
            font-weight: 600; cursor: pointer; transition: transform 0.2s; border: 2px solid var(--primary-pink);
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90px; position: relative;
        }
        .box:active { transform: scale(0.95); }
        .box-icon { font-size: 24px; margin-bottom: 10px; }

        /* BOX "AGGIUNGI" ROSA */
        .box-add {
            background: var(--accent-pink); padding: 20px 15px; border-radius: 20px; text-align: center;
            font-weight: bold; color: white; cursor: pointer; transition: transform 0.2s; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90px;
            box-shadow: 0 6px 15px rgba(240, 98, 146, 0.3); border: none;
        }
        .box-add:active { transform: scale(0.95); }
        .box-add-icon { font-size: 28px; margin-bottom: 5px; font-weight: normal; }

        .delete-btn {
            position: absolute; top: -10px; left: -10px; background: #ff5252; color: white; border-radius: 50%;
            width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; z-index: 10; border: 2px solid white;
        }

        /* MODALE */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: flex-end; z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: var(--white); width: 100%; max-width: 500px; 
            height: 92vh; border-radius: 30px 30px 0 0; padding: 15px 25px 40px 25px; 
            overflow-y: auto; box-sizing: border-box; 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; touch-action: pan-y;
            will-change: transform;
        }

        .drag-handle { width: 40px; height: 5px; background: #ddd; border-radius: 3px; margin: 0 auto 15px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: var(--accent-pink); }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--primary-pink); font-size: 16px; box-sizing: border-box; }
        input[readonly] { background-color: #f2f2f2; color: #888; }
        .btn-save { width: 100%; padding: 15px; background: var(--accent-pink); color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; margin-top: 10px; cursor: pointer; }

        /* --- FINESTRE DI DIALOGO CUSTOM (NO LINK NETLIFY) --- */
        .custom-dialog-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
            display: none; align-items: center; justify-content: center; z-index: 10005;
        }
        .custom-dialog-box {
            background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid var(--primary-pink);
        }
        .custom-dialog-title { color: var(--accent-pink); margin: 0 0 15px 0; font-size: 20px; }
        .custom-dialog-message { margin-bottom: 20px; font-size: 16px; color: var(--dark-text); }
        .custom-dialog-input { display: none; width: 100%; margin-bottom: 20px; padding: 12px; border-radius: 12px; border: 1px solid var(--accent-pink); box-sizing: border-box; font-size:16px;}
        .custom-dialog-buttons { display: flex; gap: 10px; justify-content: center; }
        .custom-btn-cancel { flex: 1; padding: 12px; border: none; background: #e0e0e0; color: #555; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .custom-btn-ok { flex: 1; padding: 12px; border: none; background: var(--accent-pink); color: white; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* --- LOADER TAVOLETTA --- */
        .loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }

        .archaeo-icon {
            width: 160px; height: 160px; fill: none; stroke: var(--accent-pink);
            stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
            transform-box: fill-box;
        }

        .brush-anim { animation: dusting 1.2s ease-in-out infinite; transform-origin: top center; }
        .dust-particle { animation: puff 1.2s ease-in-out infinite; fill: var(--accent-pink); stroke: none; }

        @keyframes dusting {
            0%, 100% { transform: rotate(-22deg) translateX(-8px); }
            50% { transform: rotate(22deg) translateX(8px); }
        }
        @keyframes puff {
            0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
            50% { opacity: 0.6; transform: translateY(-12px) scale(1.2); }
        }

        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: var(--accent-pink); color: white; padding: 12px 25px;
            border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10001; transition: bottom 0.4s ease; font-weight: bold; text-align: center; min-width: 200px;
        }
        #toast.show { bottom: 40px; }
    </style>
</head>
<body>

    <!-- POP-UP CUSTOM: CAT DICE -->
    <div id="custom-dialog" class="custom-dialog-overlay">
        <div class="custom-dialog-box">
            <h3 class="custom-dialog-title" id="dialog-title">Cat dice</h3>
            <div class="custom-dialog-message" id="dialog-message"></div>
            <input type="text" id="dialog-input" class="custom-dialog-input" placeholder="Scrivi qui...">
            <div class="custom-dialog-buttons">
                <button class="custom-btn-cancel" onclick="closeCustomDialog(false)">Annulla</button>
                <button class="custom-btn-ok" onclick="closeCustomDialog(true)">OK</button>
            </div>
        </div>
    </div>

    <!-- LOADER -->
    <div id="loader" class="loader-container">
        <svg class="archaeo-icon" viewBox="0 0 64 64">
            <path d="M15 15 L48 12 L52 45 L40 55 L12 50 L10 28 Z" opacity="0.3" fill="none" stroke-width="2.5"/>
            <path d="M30 13 L33 22 L28 32" opacity="0.2" /> 
            
            <text font-size="2.8" fill="var(--accent-pink)" opacity="0.8" 
                  x="32" text-anchor="middle"
                  style="font-family: serif; letter-spacing: 0.5px; stroke: none; font-weight: 100;">
                <tspan x="32" y="24">𒆪𒀠𒁍𒌝𒀀𒇉𒄒𒉣</tspan>
                <tspan x="32" y="30">𒌓𒄒𒉣𒋾𒀭𒆘𒀀</tspan>
                <tspan x="32" y="36">𒀭𒌓𒀝𒆪𒌋𒀭</tspan>
                <tspan x="32" y="42">𒈦𒇻𒀠𒁍𒌝𒀀𒇉</tspan>
            </svg>

        <svg class="archaeo-icon" style="position: absolute;" viewBox="0 0 64 64">
            <line x1="28" y1="20" x2="36" y2="44" stroke-width="2.5" />
            <path class="brush-anim" d="M32 15 L28 32 C28 35 36 35 36 32 Z" fill="var(--primary-pink)" stroke="var(--accent-pink)" stroke-width="1.5" />
            <circle class="dust-particle" cx="24" cy="40" r="1.5" style="animation-delay: 0.2s;" />
            <circle class="dust-particle" cx="40" cy="42" r="2" style="animation-delay: 0.5s;" />
            <circle class="dust-particle" cx="32" cy="46" r="1" style="animation-delay: 0.8s;" />
        </svg>
        <div style="margin-top: 20px; font-weight: bold; color: var(--accent-pink); letter-spacing: 1px;" id="loader-text">CARICAMENTO...</div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast">Operazione completata</div>

    <div class="header-container">
        <div class="top-bar">
            <button class="back-btn" id="backBtn" onclick="goBack()">←</button>
        </div>
        <div class="breadcrumb" id="breadcrumb">Radice</div>
        
        <!-- BARRA COMPILATORE (Menu a tendina superiore) -->
        <div class="compiler-bar" onclick="changeCompilerPrompt()">
            <div>
                <div class="compiler-label">Compilatore di Default</div>
                <div class="compiler-name" id="displayCompilerName">Non impostato (Clicca per inserire)</div>
            </div>
            <div style="font-size: 18px; color: var(--accent-pink);">▼</div>
        </div>

        <input type="text" class="search-bar" id="searchBar" placeholder="Cerca US o cartelle..." oninput="filterGrid()">
    </div>

    <div class="grid-container" id="gridContainer">
        <!-- Generato Dinamicamente -->
    </div>

    <!-- MODALE COMPILAZIONE US -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <div class="drag-handle"></div>
            <h2 id="modalTitle" style="color: var(--accent-pink); margin-top:0; margin-bottom:15px;">Nuova US</h2>
            <form id="usForm" onsubmit="saveUS(event)">
                
                <div class="form-group">
                    <label>Numero US</label>
                    <input type="number" id="usNumber" required placeholder="Es. 1001">
                </div>
                
                <div class="form-group">
                    <label>Compilatore (Operatore)</label>
                    <input type="text" id="usCompiler" required placeholder="Nome o sigla operatore">
                </div>

                <div class="form-group">
                    <label>Definizione Stratigrafica</label>
                    <select id="usDefinizione" required>
                        <option value="">Seleziona...</option>
                        <option value="Strato">Strato</option>
                        <option value="Muro">Muro</option>
                        <option value="Taglio">Taglio</option>
                        <option value="Riempimento">Riempimento</option>
                        <option value="Fossa">Fossa</option>
                        <option value="Pavimento">Pavimento</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Consistenza</label>
                    <select id="usConsistenza">
                        <option value="Compatta">Compatta</option>
                        <option value="Media">Media</option>
                        <option value="Sgombra/Semicompatta">Sgombra / Semicompatta</option>
                        <option value="Sgretolabile/Sabbiosa">Sgretolabile / Sabbiosa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Colore Munsell o Descrittivo</label>
                    <input type="text" id="usColore" placeholder="Es. 10YR 5/4 yellowish brown">
                </div>

                <div class="form-group">
                    <label>Descrizione sintetica</label>
                    <textarea id="usDescrizione" rows="3" placeholder="Descrivi la US..."></textarea>
                </div>

                <button type="submit" class="btn-save">Salva US</button>
            </form>
        </div>
    </div>

    <script>
        let currentPath = []; // Esempio: ["Saggio A", "Ambiente 1"]
        let db = JSON.parse(localStorage.getItem('us_db_v2')) || { name: "Radice", type: "folder", children: [] };
        let activeUS = null; 

        // Gestione di Cat Dialog personalizzato
        let dialogCallback = null;

        function showCatDialog(title, message, isInput, defaultValue = "", callback) {
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-message').innerText = message;
            const inputField = document.getElementById('dialog-input');
            
            if (isInput) {
                inputField.style.display = 'block';
                inputField.value = defaultValue;
                setTimeout(() => inputField.focus(), 100);
            } else {
                inputField.style.display = 'none';
            }
            
            dialogCallback = callback;
            document.getElementById('custom-dialog').style.display = 'flex';
        }

        function closeCustomDialog(isOk) {
            document.getElementById('custom-dialog').style.display = 'none';
            const inputField = document.getElementById('dialog-input');
            const val = inputField.value;
            if (dialogCallback) {
                dialogCallback(isOk, val);
            }
            dialogCallback = null;
        }

        // Gestione del Compilatore in memoria locale (localStorage)
        function getCompiler() {
            return localStorage.getItem('us_default_compiler') || "";
        }

        function setCompiler(name) {
            localStorage.setItem('us_default_compiler', name.trim());
            updateCompilerDisplay();
        }

        function updateCompilerDisplay() {
            const current = getCompiler();
            const displayEl = document.getElementById('displayCompilerName');
            if (current) {
                displayEl.innerText = current;
                displayEl.style.color = "var(--accent-pink)";
            } else {
                displayEl.innerText = "Non impostato (Clicca per inserire)";
                displayEl.style.color = "#aaa";
            }
        }

        function changeCompilerPrompt() {
            const current = getCompiler();
            showCatDialog("Cat dice", "Chi è il compilatore di default oggi?", true, current, (isOk, val) => {
                if (isOk) {
                    if (val && val.trim() !== "") {
                        setCompiler(val);
                        showToast("Compilatore aggiornato: " + val);
                    } else {
                        showCatDialog("Cat dice", "Il nome non può essere vuoto!", false, "", null);
                    }
                }
            });
        }

        // Controllo all'avvio del compilatore
        window.addEventListener('DOMContentLoaded', () => {
            updateCompilerDisplay();
            const comp = getCompiler();
            if (!comp) {
                // Se manca, avvisa subito in modo gentile
                setTimeout(() => {
                    showCatDialog("Cat dice", "Benvenuto! Inserisci il nome o la sigla del compilatore per iniziare.", true, "", (isOk, val) => {
                        if (isOk && val.trim() !== "") {
                            setCompiler(val);
                        } else {
                            // Se insiste a lasciarlo vuoto, rimanda finché non lo mette o avvisa
                            setCompiler("Ospite");
                        }
                    });
                }, 500);
            }
        });

        // LOADER DINAMICO
        function showLoader(text, callback) {
            const loader = document.getElementById('loader');
            document.getElementById('loader-text').innerText = text || "CARICAMENTO...";
            loader.style.display = 'flex';
            setTimeout(() => {
                loader.style.display = 'none';
                if(callback) callback();
            }, 600); // Simulazione reattività immediata tavoletta d'argilla
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function saveDB() {
            localStorage.setItem('us_db_v2', JSON.stringify(db));
        }

        function getCurrentFolder() {
            let pointer = db;
            for (let segment of currentPath) {
                pointer = pointer.children.find(c => c.name === segment && c.type === 'folder');
            }
            return pointer;
        }

        function render() {
            const grid = document.getElementById('gridContainer');
            const breadcrumb = document.getElementById('breadcrumb');
            const backBtn = document.getElementById('backBtn');
            const searchBar = document.getElementById('searchBar');

            grid.innerHTML = '';
            
            // Breadcrumb text
            if (currentPath.length === 0) {
                breadcrumb.innerHTML = "Radice / <b>Tutti i contesti</b>";
                backBtn.style.display = 'none';
            } else {
                breadcrumb.innerHTML = "Radice / " + currentPath.join(" / ");
                backBtn.style.display = 'flex';
            }

            const folder = getCurrentFolder();

            // Pulsanti di creazione fissa in cima
            const addFolderBox = document.createElement('div');
            addFolderBox.className = 'box-add';
            addFolderBox.innerHTML = `<div class="box-add-icon">📁+</div><span>Crea Cartella</span>`;
            addFolderBox.onclick = promptCreateFolder;
            grid.appendChild(addFolderBox);

            const addUSBox = document.createElement('div');
            addUSBox.className = 'box-add';
            addUSBox.innerHTML = `<div class="box-add-icon">📝+</div><span>Nuova US</span>`;
            addUSBox.onclick = openNewUSModal;
            grid.appendChild(addUSBox);

            // Elementi della cartella corrente
            folder.children.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = 'box';
                
                // Tasto Elimina rapido sull'elemento
                const delBtn = document.createElement('div');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    showCatDialog("Cat dice", `Vuoi davvero eliminare "${item.name}"?`, false, "", (isOk) => {
                        if(isOk) {
                            folder.children.splice(index, 1);
                            saveDB();
                            showLoader("AGGIORNAMENTO...", () => {
                                render();
                                showToast("Elemento eliminato");
                            });
                        }
                    });
                };
                box.appendChild(delBtn);

                if (item.type === 'folder') {
                    box.innerHTML += `<div class="box-icon">📁</div><span>${item.name}</span>`;
                    box.onclick = () => {
                        showLoader("APERTURA CARTELLA...", () => {
                            currentPath.push(item.name);
                            searchBar.value = '';
                            render();
                        });
                    };
                } else {
                    box.innerHTML += `<div class="box-icon">📄</div><span>US ${item.data.usNumber}</span><div style="font-size:11px; color:#888; margin-top:4px;">${item.data.usDefinizione}</div>`;
                    box.onclick = () => openEditUSModal(item, index);
                }
                grid.appendChild(box);
            });
        }

        function goBack() {
            showLoader("TORNO INDIETRO...", () => {
                currentPath.pop();
                document.getElementById('searchBar').value = '';
                render();
            });
        }

        function promptCreateFolder() {
            showCatDialog("Cat dice", "Inserisci il nome della nuova cartella (es. Saggio B, Vano 3):", true, "", (isOk, folderName) => {
                if (isOk && folderName && folderName.trim() !== "") {
                    const folder = getCurrentFolder();
                    if(folder.children.some(c => c.name === folderName && c.type === 'folder')) {
                        showCatDialog("Cat dice", "Esiste già una cartella con questo nome!", false, "", null);
                        return;
                    }
                    folder.children.push({ name: folderName.trim(), type: 'folder', children: [] });
                    saveDB();
                    showLoader("CREAZIONE...", () => {
                        render();
                        showToast("Cartella creata con successo");
                    });
                }
            });
        }

        // APERTURA MODALE NUOVA US
        function openNewUSModal() {
            // CONTROLLO OBBLIGATORIO COMPILATORE
            const defaultComp = getCompiler();
            if (!defaultComp) {
                showCatDialog("Cat dice", "Imposta prima un compilatore cliccando sulla barra in alto!", false, "", null);
                return;
            }

            activeUS = null;
            document.getElementById('modalTitle').innerText = "Nuova US";
            document.getElementById('usForm').reset();
            
            // Assegna in automatico il compilatore salvato in memoria
            document.getElementById('usCompiler').value = defaultComp;

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function openEditUSModal(item, index) {
            activeUS = { item, index };
            document.getElementById('modalTitle').innerText = "Modifica US " + item.data.usNumber;
            document.getElementById('usNumber').value = item.data.usNumber;
            document.getElementById('usCompiler').value = item.data.usCompiler || getCompiler();
            document.getElementById('usDefinizione').value = item.data.usDefinizione;
            document.getElementById('usConsistenza').value = item.data.usConsistenza;
            document.getElementById('usColore').value = item.data.usColore;
            document.getElementById('usDescrizione').value = item.data.usDescrizione;

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function saveUS(e) {
            e.preventDefault();
            
            const compilerVal = document.getElementById('usCompiler').value.trim();
            if(!compilerVal) {
                showCatDialog("Cat dice", "Il campo compilatore non può essere vuoto!", false, "", null);
                return;
            }

            const usData = {
                usNumber: document.getElementById('usNumber').value,
                usCompiler: compilerVal,
                usDefinizione: document.getElementById('usDefinizione').value,
                usConsistenza: document.getElementById('usConsistenza').value,
                usColore: document.getElementById('usColore').value,
                usDescrizione: document.getElementById('usDescrizione').value
            };

            const folder = getCurrentFolder();

            if (activeUS === null) {
                // Nuova
                folder.children.push({ name: "US " + usData.usNumber, type: 'us', data: usData });
                showToast("US salvata con successo");
            } else {
                // Modifica
                folder.children[activeUS.index] = { name: "US " + usData.usNumber, type: 'us', data: usData };
                showToast("US aggiornata");
            }

            saveDB();
            closeModal();
            render();
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        // Chiusura modale cliccando fuori o trascinando in basso
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        let startY = 0;

        modalContent.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, {passive: true});

        modalContent.addEventListener('touchmove', (e) => {
            let currentY = e.touches[0].clientY;
            if (currentY - startY > 100 && modalContent.scrollTop === 0) {
                closeModal();
            }
        }, {passive: true});

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Filtro di ricerca istantaneo
        function filterGrid() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const grid = document.getElementById('gridContainer');
            const folder = getCurrentFolder();

            // Svuota e ricarica i box fissi
            grid.innerHTML = '';
            
            const addFolderBox = document.createElement('div');
            addFolderBox.className = 'box-add';
            addFolderBox.innerHTML = `<div class="box-add-icon">📁+</div><span>Crea Cartella</span>`;
            addFolderBox.onclick = promptCreateFolder;
            grid.appendChild(addFolderBox);

            const addUSBox = document.createElement('div');
            addUSBox.className = 'box-add';
            addUSBox.innerHTML = `<div class="box-add-icon">📝+</div><span>Nuova US</span>`;
            addUSBox.onclick = openNewUSModal;
            grid.appendChild(addUSBox);

            folder.children.forEach((item, index) => {
                const matchName = item.name.toLowerCase().includes(query);
                const matchNum = item.type === 'us' && item.data.usNumber.toLowerCase().includes(query);
                const matchDef = item.type === 'us' && item.data.usDefinizione.toLowerCase().includes(query);

                if (query === '' || matchName || matchNum || matchDef) {
                    const box = document.createElement('div');
                    box.className = 'box';
                    
                    const delBtn = document.createElement('div');
                    delBtn.className = 'delete-btn';
                    delBtn.innerHTML = '×';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        showCatDialog("Cat dice", `Vuoi davvero eliminare "${item.name}"?`, false, "", (isOk) => {
                            if(isOk) {
                                folder.children.splice(index, 1);
                                saveDB();
                                filterGrid();
                                showToast("Elemento eliminato");
                            }
                        });
                    };
                    box.appendChild(delBtn);

                    if (item.type === 'folder') {
                        box.innerHTML += `<div class="box-icon">📁</div><span>${item.name}</span>`;
                        box.onclick = () => {
                            showLoader("APERTURA CARTELLA...", () => {
                                currentPath.push(item.name);
                                document.getElementById('searchBar').value = '';
                                render();
                            });
                        };
                    } else {
                        box.innerHTML += `<div class="box-icon">📄</div><span>US ${item.data.usNumber}</span><div style="font-size:11px; color:#888; margin-top:4px;">${item.data.usDefinizione}</div>`;
                        box.onclick = () => openEditUSModal(item, index);
                    }
                    grid.appendChild(box);
                }
            });
        }

        // Avvio iniziale
        render();
    </script>
</body>
</html>
