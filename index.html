<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>US Digitali - ArcheoApp</title>
    <style>
        :root {
            --primary-pink: #fce4ec;
            --accent-pink: #f06292;
            --dark-text: #4a4a4a;
            --white: #ffffff;
            --bg-color: #fff5f8;
        }

        html, body { 
            overscroll-behavior-y: contain; 
            overflow: hidden;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .header-container { width: 100%; max-width: 500px; margin-bottom: 20px; }
        
        .top-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .hamburger-btn {
            background: none; border: none; color: var(--accent-pink);
            font-size: 32px; cursor: pointer; padding: 0; margin: 0;
            display: flex; align-items: center; justify-content: center;
            line-height: 1;
        }

        .back-btn {
            display: none; 
            align-items: center; justify-content: center;
            background: var(--white); color: var(--accent-pink);
            border: 2px solid var(--primary-pink); border-radius: 50%;
            width: 35px; height: 35px; cursor: pointer;
            font-size: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .breadcrumb { 
            font-size: 14px; color: var(--dark-text); 
            font-weight: 500; opacity: 0.8; margin-bottom: 10px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .breadcrumb b { color: var(--accent-pink); opacity: 1; }

        .search-bar { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; background: var(--white); box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 16px; outline: none; box-sizing: border-box; }

        .filter-pill {
            padding: 6px 14px; border-radius: 15px; background: var(--white); color: var(--dark-text);
            font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--primary-pink);
            transition: 0.2s; user-select: none;
        }
        .filter-pill.active { background: var(--accent-pink); color: white; border-color: var(--accent-pink); }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; padding-bottom: 100px; }

        .box {
            background: var(--white); padding: 20px 15px; border-radius: 20px; text-align: center;
            font-weight: 600; cursor: pointer; transition: transform 0.2s; border: 2px solid var(--primary-pink);
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90px; position: relative;
        }
        .box:active { transform: scale(0.95); }
        .box-icon { font-size: 24px; margin-bottom: 10px; }

        .box-add {
            background: var(--accent-pink); padding: 20px 15px; border-radius: 20px; text-align: center;
            font-weight: bold; color: white; cursor: pointer; transition: transform 0.2s; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90px;
            box-shadow: 0 6px 15px rgba(240, 98, 146, 0.3); border: none;
        }
        .box-add:active { transform: scale(0.95); }
        .box-add-icon { font-size: 28px; margin-bottom: 5px; font-weight: normal; }

        .delete-btn {
            position: absolute; top: -10px; left: -10px; background: #ff5252; color: white; border-radius: 50%;
            width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; z-index: 10; border: 2px solid white;
        }

        /* SIDEBAR */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            display: none; z-index: 10002; backdrop-filter: blur(2px);
            opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: var(--white); z-index: 10003; transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 2px 0 15px rgba(0,0,0,0.2); padding: 25px; box-sizing: border-box;
            display: flex; flex-direction: column;
        }
        .sidebar-header {
            font-size: 22px; font-weight: bold; color: var(--accent-pink);
            margin-bottom: 25px; border-bottom: 2px solid var(--primary-pink); padding-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-close { font-size: 24px; cursor: pointer; color: var(--dark-text); }
        .sidebar-content { flex: 1; overflow-y: auto; }
        .reg-info-text { font-size: 13px; color: #666; margin: 0 0 10px 0; line-height: 1.4; }

        /* MODALE SCHEDA US */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: flex-end; z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: var(--white); width: 100%; max-width: 500px; 
            height: 92vh; border-radius: 30px 30px 0 0; padding: 15px 25px 40px 25px; 
            overflow-y: auto; box-sizing: border-box; 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; touch-action: pan-y;
            will-change: transform;
        }

        .drag-handle { width: 40px; height: 5px; background: #ddd; border-radius: 3px; margin: 0 auto 15px auto; }
        .form-group { margin-bottom: 15px; }
        
        .label-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .label-header label { font-size: 14px; font-weight: 600; color: var(--accent-pink); margin: 0; display:block; }
        .mic-btn { background: none; border: none; font-size: 18px; cursor: pointer; transition: 0.2s; padding: 0 5px; }
        
        input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--primary-pink); font-size: 16px; box-sizing: border-box; }
        input[readonly] { background-color: #f2f2f2; color: #888; }
        .btn-save { width: 100%; padding: 15px; background: var(--accent-pink); color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; margin-top: 10px; cursor: pointer; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* DIALOG E LOADER */
        .custom-dialog-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
            display: none; align-items: center; justify-content: center; z-index: 10005;
        }
        .custom-dialog-box {
            background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid var(--primary-pink);
        }
        .custom-dialog-title { color: var(--accent-pink); margin: 0 0 15px 0; font-size: 20px; }
        .custom-dialog-message { margin-bottom: 20px; font-size: 16px; color: var(--dark-text); }
        .custom-dialog-input { display: none; width: 100%; margin-bottom: 20px; padding: 12px; border-radius: 12px; border: 1px solid var(--accent-pink); box-sizing: border-box; font-size:16px;}
        .custom-dialog-buttons { display: flex; gap: 10px; justify-content: center; }
        .custom-btn-cancel { flex: 1; padding: 12px; border: none; background: #e0e0e0; color: #555; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .custom-btn-ok { flex: 1; padding: 12px; border: none; background: var(--accent-pink); color: white; border-radius: 12px; font-weight: bold; cursor: pointer; }

        .loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .archaeo-icon {
            width: 160px; height: 160px; fill: none; stroke: var(--accent-pink);
            stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box;
        }
        .brush-anim { animation: dusting 1.2s ease-in-out infinite; transform-origin: top center; }
        .dust-particle { animation: puff 1.2s ease-in-out infinite; fill: var(--accent-pink); stroke: none; }
        @keyframes dusting { 0%, 100% { transform: rotate(-22deg) translateX(-8px); } 50% { transform: rotate(22deg) translateX(8px); } }
        @keyframes puff { 0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); } 50% { opacity: 0.6; transform: translateY(-12px) scale(1.2); } }

        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: var(--accent-pink); color: white; padding: 12px 25px;
            border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10001; transition: bottom 0.4s ease; font-weight: bold; text-align: center; min-width: 200px;
        }
        #toast.show { bottom: 40px; }
    </style>
</head>
<body>

    <!-- MENU A SCORRIMENTO -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span>Menù</span>
            <div class="sidebar-close" onclick="closeSidebar()">✕</div>
        </div>
        <div class="sidebar-content">
            <div class="form-group">
                <div class="label-header"><label>Registrazione Utente</label></div>
                <p class="reg-info-text">Imposta qui il tuo nome. Verrà aggiunto al database e selezionato in automatico come operatore su questo dispositivo.</p>
                <input type="text" id="nome-registrazione" placeholder="Es: Mario R.">
                <button class="btn-save" onclick="registraUtente()" style="padding:10px; font-size:16px;">Registrati</button>
            </div>
            <div id="reg-status" style="margin-top:15px; font-size:14px; color:var(--accent-pink); display:none; background:var(--primary-pink); padding:10px; border-radius:10px;">
                Utente attivo sul dispositivo:
                <select id="reg-name-select" onchange="selezionaOperatoreDefault(this.value)" style="margin-top:8px; padding:10px; font-size:16px; font-weight:bold; border:1px solid var(--accent-pink); border-radius:10px; background:white; color:var(--dark-text);"></select>
            </div>
        </div>
    </div>

    <!-- DIALOG CUSTOM -->
    <div id="custom-dialog" class="custom-dialog-overlay">
        <div class="custom-dialog-box">
            <h3 class="custom-dialog-title" id="dialog-title">CaTho</h3>
            <div class="custom-dialog-message" id="dialog-message"></div>
            <input type="text" id="dialog-input" class="custom-dialog-input" placeholder="Scrivi qui...">
            <div class="custom-dialog-buttons">
                <button class="custom-btn-cancel" onclick="closeCustomDialog(false)">Annulla</button>
                <button class="custom-btn-ok" onclick="closeCustomDialog(true)">OK</button>
            </div>
        </div>
    </div>

    <!-- LOADER -->
    <div id="loader" class="loader-container">
        <svg class="archaeo-icon" viewBox="0 0 64 64">
            <path d="M15 15 L48 12 L52 45 L40 55 L12 50 L10 28 Z" opacity="0.3" fill="none" stroke-width="2.5"/>
            <path d="M30 13 L33 22 L28 32" opacity="0.2" /> 

            <text font-size="2.8" fill="var(--accent-pink)" opacity="0.8" 
                  x="32" text-anchor="middle"
                  style="font-family: serif; letter-spacing: 0.5px; stroke: none; font-weight: 100;">
                <tspan x="32" y="24">𒆪𒀠𒁍𒌝𒀀𒇉𒄒𒉣</tspan>
                <tspan x="32" y="30">𒌓𒄒𒉣𒋾𒀭𒆘𒀀</tspan>
                <tspan x="32" y="36">𒀭𒌓𒀝𒆪𒌋𒀭</tspan>
                <tspan x="32" y="42">𒈦𒇻𒀠𒁍𒌝𒆘𒀀𒁺</tspan>
                <tspan x="32" y="48">𒀭𒀠𒀫𒀭𒈾</tspan>
            </text>

            <circle class="dust-particle" cx="30" cy="18" r="1.2" />
            <circle class="dust-particle" cx="42" cy="22" r="0.8" style="animation-delay: 0.3s;"/>
            <g class="brush-anim">
                <rect x="30" y="2" width="4" height="18" rx="1" fill="var(--accent-pink)" /> 
                <path d="M26 20 L38 20 L42 35 L22 35 Z" fill="var(--bg-color)" stroke-width="2" />
            </g>
        </svg>
        <div id="loader-text" style="margin-top: 15px; color: var(--accent-pink); font-weight: bold; font-size: 16px; letter-spacing: 1px;">CARICAMENTO...</div>
    </div>

    <div id="toast">Messaggio</div>
    <!-- EDITOR FOTO: scrivere/disegnare sulle foto -->
    <style>
        .ed-btn { padding: 10px 14px; border-radius: 20px; border: 2px solid var(--accent-pink); background: transparent; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
        .ed-btn.active { background: var(--accent-pink); }
        #ed-canvas { max-width: 100%; max-height: calc(100vh - 190px); max-height: calc(100dvh - 190px); touch-action: none; border-radius: 8px; background: #000; }
    </style>
    <div id="foto-editor" style="display:none; position:fixed; inset:0; background:#1c1c1c; z-index:10004; flex-direction:column;">
        <div style="display:flex; gap:8px; padding:10px; justify-content:center; background:#2a2a2a;">
            <button type="button" id="ed-btn-pen" class="ed-btn active" onclick="edSetMode('pen')">✏️ Penna</button>
            <button type="button" id="ed-btn-text" class="ed-btn" onclick="edSetMode('text')">🔤 Testo</button>
            <button type="button" class="ed-btn" onclick="edUndo()">↩️ Indietro</button>
        </div>
        <div id="ed-hint" style="text-align:center; color:#ccc; font-size:12px; padding:6px;">Disegna col dito sulla foto</div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:0 10px;">
            <canvas id="ed-canvas"></canvas>
        </div>
        <div style="display:flex; gap:10px; padding:12px; background:#2a2a2a;">
            <button type="button" class="ed-btn" style="flex:1;" onclick="edChiudi()">Annulla</button>
            <button type="button" class="ed-btn active" style="flex:1;" onclick="edSalva()">✓ Salva foto</button>
        </div>
    </div>

    <!-- HEADER -->
    <div class="header-container">
        <div class="top-bar">
            <button class="hamburger-btn" onclick="openSidebar()">☰</button>
            <div id="back-arrow" class="back-btn" onclick="goBack()">←</div>
        </div>
        <div id="breadcrumb" class="breadcrumb">Home</div>
        <input type="text" id="search-input" class="search-bar" placeholder="Cerca per Numero US..." oninput="cercaUS(this.value)">
        <div id="search-filters" style="display:flex; gap:8px; margin-top:8px;">
            <div class="filter-pill active" data-filter="US" onclick="setSearchFilter('US')">🔢 US</div>
            <div class="filter-pill" data-filter="PAROLA" onclick="setSearchFilter('PAROLA')">🔤 Parola</div>
        </div>
    </div>

    <div id="main-grid" class="grid-container"></div>

    <!-- MODALE SCHEDA US -->
    <div id="form-modal" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-content" id="modal-content">
            <div class="drag-handle"></div>
            <h2 style="text-align:center; color: var(--accent-pink); margin-top:0;">Scheda US</h2>
            
            <div class="form-group">
                <div class="label-header"><label>Contesto</label></div>
                <input type="text" id="form-context" readonly>
            </div>

            <div class="form-group">
                <div class="label-header"><label>Numero US</label></div>
                <input type="number" id="num_us" placeholder="Es: 100" required oninput="validaNumUS(true)">
                <div id="num_us_error" style="display:none; font-size:12px; color:#ff5252; margin-top:4px;"></div>
            </div>

            <div class="form-group">
                <div class="label-header"><label>Tipo US</label></div>
                <select id="tipo_us">
                    <option value="piano">Piano</option>
                    <option value="taglio">Taglio</option>
                    <option value="riempimento">Riempimento</option>
                    <option value="accumulo">Accumulo</option>
                    <option value="installazione">Installazione</option>
                    <option value="muro">Muro</option>
                    <option value="superficie d'uso">Superficie d'uso</option>
                    <option value="pavimento">Pavimento</option>
                </select>
            </div>

            <div class="form-group">
                <div class="label-header"><label>Operatore</label></div>
                <select id="operatore"></select>
            </div>

            <!-- NUOVI CAMPI: QUOTE -->
            <div class="form-group">
                <div class="label-header"><label>Quote</label></div>
                <div class="grid-2">
                    <input type="number" id="quota_sup" step="any" placeholder="Superiore (es. 15.20)">
                    <input type="number" id="quota_inf" step="any" placeholder="Inferiore (es. 14.85)">
                </div>
            </div>

            <!-- UPLOAD FILE MULTIPLI (Foto, Video, Documenti) -->
            <div class="form-group">
                <div class="label-header"><label>Media / Documenti (Foto, Video, ecc.)</label></div>
                <label for="file_foto" class="btn-save" style="display:block; box-sizing:border-box; text-align:center; font-size:14px; padding:12px; margin-top:5px;">📎 Aggiungi foto / file</label>
                <input type="file" id="file_foto" multiple style="display:none;">
                <div id="media_list" style="display:flex; flex-direction:column; gap:12px; margin-top:12px;"></div>
            </div>

            <div class="label-header"><label>Rapporti Stratigrafici</label></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px;">
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('Copre')">Copre</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('È coperto da')">Coperto da</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('Taglia')">Taglia</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('È tagliato da')">Tagliato da</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('Riempie')">Riempie</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('È riempito da')">Riempito da</button>
            </div>
            <div id="chips-area" style="display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;"></div>

            <!-- DESCRIZIONE CON DETTATURA -->
            <div class="form-group" style="margin-top:15px;">
                <div class="label-header">
                    <label>Descrizione</label>
                    <button type="button" class="mic-btn" onclick="startDictation('descrizione', this)" title="Dettatura vocale">🎤</button>
                </div>
                <textarea id="descrizione" rows="3"></textarea>
            </div>

            <!-- INTERPRETAZIONE CON DETTATURA -->
            <div class="form-group">
                <div class="label-header">
                    <label>Interpretazione</label>
                    <button type="button" class="mic-btn" onclick="startDictation('interpretazione', this)" title="Dettatura vocale">🎤</button>
                </div>
                <textarea id="interpretazione" rows="3"></textarea>
            </div>

            <button class="btn-save" id="save-btn-text" onclick="salvaDati()">INVIA DATI</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:gray; margin-top:15px; cursor:pointer;">Annulla</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwrcw9ubYVb83iuzwCCg5Dsg_Bb6hwktmyaJ2sj5hcxWOZEt4rmA8M884bbaSeNhb8r/exec';

        let dataStruttura = {};
        let currentLevel = "HOME";
        let path = { scavo: "", cantiere: "", quadrante: "" };
        let rapportiDati = [];
        let databaseLocale = [];
        let operatoriList = [];

        const grid = document.getElementById('main-grid');
        const breadcrumb = document.getElementById('breadcrumb');
        const modal = document.getElementById('form-modal');
        const modalContent = document.getElementById('modal-content');
        const chipsArea = document.getElementById('chips-area');

        /* INIZIALIZZAZIONE DETTATURA VOCALE */
        let speechRecognition;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SpeechRec();
            speechRecognition.lang = 'it-IT';
            speechRecognition.continuous = false; 
            speechRecognition.interimResults = false;
        }

        let isListening = false;
        function startDictation(fieldId, btnElement) {
            if (!speechRecognition) {
                showToast("Dettatura vocale non supportata da questo browser (usa Chrome o Safari).");
                return;
            }

            // Se sta già registrando, il secondo click ferma la registrazione
            if (isListening) {
                speechRecognition.stop();
                return;
            }
            
            speechRecognition.onstart = function() {
                isListening = true;
                btnElement.innerText = "🔴";
                showToast("In ascolto...");
            };
            
            speechRecognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                const field = document.getElementById(fieldId);
                field.value += (field.value.length > 0 && !field.value.endsWith(' ') ? " " : "") + transcript;
            };
            
            speechRecognition.onend = function() {
                isListening = false;
                btnElement.innerText = "🎤";
            };
            
            speechRecognition.onerror = function(event) {
                showToast("Errore dettatura.");
                isListening = false;
                btnElement.innerText = "🎤";
            };
            
            speechRecognition.start();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function openSidebar() {
            document.getElementById('sidebar-overlay').style.display = 'block';
            setTimeout(() => { document.getElementById('sidebar-overlay').style.opacity = '1'; document.getElementById('sidebar').style.left = '0'; }, 10);
            const savedName = localStorage.getItem('defaultOperatore');
            if(savedName) document.getElementById('nome-registrazione').value = savedName;
            popolaSelectUtenteAttivo();
        }

        function popolaSelectUtenteAttivo() {
            const sel = document.getElementById('reg-name-select');
            const regStatus = document.getElementById('reg-status');
            if(operatoriList.length === 0) { regStatus.style.display = 'none'; return; }
            sel.innerHTML = "";

        /* ===== FILE MULTIPLI + EDITOR ANNOTAZIONI FOTO ===== */
        const COLORE_PENNA = '#ff1f5a';   // rosso-rosato: cambia qui se vuoi un'altra tinta
        const MAX_LATO_FOTO = 2000;       // lato massimo (px) delle foto inviate/modificate

        let filesDaCaricare = [];   // file scelti ma non ancora salvati
        let mediaEsistenti = [];    // link già salvati su Drive per questa US

        function renderMedia() {
            const box = document.getElementById('media_list'); box.innerHTML = "";

        /* Riduce le foto pesanti prima dell'invio (i file non-immagine restano invariati) */
        function comprimiImmagine(file) {
            return new Promise(resolve => {
                if (!file.type.startsWith('image/') || file.size < 2000000) return resolve(file);
                const img = new Image(); const url = URL.createObjectURL(file);
                img.onload = () => {
                    const s = Math.min(1, MAX_LATO_FOTO / Math.max(img.naturalWidth, img.naturalHeight));
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    c.toBlob(b => {
                        URL.revokeObjectURL(url);
                        resolve(b ? new File([b], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }) : file);
                    }, 'image/jpeg', 0.88);
                };
                img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
                img.src = url;
            });
        }

        /* ---- Editor: penna, testo, indietro ---- */
        let edId = null, edImg = null, edActions = [], edDraw = null, edMode = 'pen', edTextPos = null;
        const edCanvas = document.getElementById('ed-canvas');
        const edCtx = edCanvas.getContext('2d');
        const edSpessore = () => Math.max(4, edCanvas.width / 160);
        const edCorpoTesto = () => Math.max(20, edCanvas.width / 16);

        function apriEditor(id) {
            const it = filesDaCaricare.find(x => x.id === id); if (!it) return;
            const img = new Image();
            img.onload = () => {
                const s = Math.min(1, MAX_LATO_FOTO / Math.max(img.naturalWidth, img.naturalHeight));
                edCanvas.width = Math.round(img.naturalWidth * s); edCanvas.height = Math.round(img.naturalHeight * s);
                edImg = img; edId = id; edActions = []; edDraw = null; edTextPos = null;
                edSetMode('pen'); edRedraw();
                document.getElementById('foto-editor').style.display = 'flex';
            };
            img.onerror = () => showToast("Impossibile aprire la foto");
            img.src = it.url;
        }

        function edSetMode(m) {
            edMode = m;
            document.getElementById('ed-btn-pen').classList.toggle('active', m === 'pen');
            document.getElementById('ed-btn-text').classList.toggle('active', m === 'text');
            document.getElementById('ed-hint').innerText = m === 'pen' ? "Disegna col dito sulla foto" : "Tocca il punto dove vuoi scrivere";
        }

        function edRedraw() {
            const c = edCtx;
            c.clearRect(0, 0, edCanvas.width, edCanvas.height);
            c.drawImage(edImg, 0, 0, edCanvas.width, edCanvas.height);
            c.lineCap = 'round'; c.lineJoin = 'round';
            edActions.concat(edDraw ? [edDraw] : []).forEach(a => {
                if (a.type === 'pen') {
                    c.strokeStyle = COLORE_PENNA; c.lineWidth = edSpessore();
                    c.beginPath();
                    a.pts.forEach((p, i) => { if (i) c.lineTo(p.x, p.y); else c.moveTo(p.x, p.y); });
                    if (a.pts.length === 1) c.lineTo(a.pts[0].x + 0.1, a.pts[0].y);   // punto singolo
                    c.stroke();
                } else {
                    const corpo = edCorpoTesto();
                    c.font = `bold ${corpo}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
                    c.lineWidth = corpo / 8; c.strokeStyle = '#ffffff'; c.strokeText(a.text, a.x, a.y);   // bordo bianco per leggibilità
                    c.fillStyle = COLORE_PENNA; c.fillText(a.text, a.x, a.y);
                }
            });
        }

        function edPos(ev) {
            const r = edCanvas.getBoundingClientRect();
            return { x: (ev.clientX - r.left) * edCanvas.width / r.width, y: (ev.clientY - r.top) * edCanvas.height / r.height };
        }

        edCanvas.addEventListener('pointerdown', ev => {
            ev.preventDefault();
            const p = edPos(ev);
            if (edMode === 'text') { edTextPos = p; return; }
            edCanvas.setPointerCapture(ev.pointerId);
            edDraw = { type: 'pen', pts: [p] }; edRedraw();
        });
        edCanvas.addEventListener('pointermove', ev => {
            if (!edDraw) return;
            const p = edPos(ev), prev = edDraw.pts[edDraw.pts.length - 1];
            edDraw.pts.push(p);
            edCtx.strokeStyle = COLORE_PENNA; edCtx.lineWidth = edSpessore(); edCtx.lineCap = 'round';
            edCtx.beginPath(); edCtx.moveTo(prev.x, prev.y); edCtx.lineTo(p.x, p.y); edCtx.stroke();   // disegna solo l'ultimo tratto (più fluido)
        });
        edCanvas.addEventListener('pointerup', async () => {
            if (edMode === 'text') {
                if (!edTextPos) return;
                const p = edTextPos; edTextPos = null;
                const t = await customPrompt("Scrivi il testo da mettere sulla foto:");
                if (t && t.trim()) { edActions.push({ type: 'text', text: t.trim(), x: p.x, y: p.y }); edRedraw(); }
            } else if (edDraw) { edActions.push(edDraw); edDraw = null; edRedraw(); }
        });
        edCanvas.addEventListener('pointercancel', () => {
            edTextPos = null;
            if (edDraw) { edActions.push(edDraw); edDraw = null; edRedraw(); }
        });

        function edUndo() { if (edActions.length) { edActions.pop(); edRedraw(); } }

        function edChiudi() {
            document.getElementById('foto-editor').style.display = 'none';
            edImg = null; edId = null; edActions = []; edDraw = null; edTextPos = null;
        }

        function edSalva() {
            edCanvas.toBlob(blob => {
                const it = filesDaCaricare.find(x => x.id === edId);
                if (it && blob) {
                    const nome = it.file.name.replace(/\.[^.]+$/, '') + "_annotata.jpg";
                    it.file = new File([blob], nome, { type: 'image/jpeg' });
                    URL.revokeObjectURL(it.url); it.url = URL.createObjectURL(it.file);
                    renderMedia();
                }
                edChiudi();
            }, 'image/jpeg', 0.88);
        }

                if(d.Operatore) operatoreSelect.value = d.Operatore;
                let url = d.Link || d.link || d.LINK || d.URL || d.FileUrl || "";
                mediaEsistenti = String(url).split(/[\s|,]+/).filter(u => u.startsWith("http"));
                saveBtnText.innerText = "AGGIORNA DATI";
            } else {
                document.getElementById('num_us').value = ""; document.getElementById('descrizione').value = ""; document.getElementById('interpretazione').value = "";
                document.getElementById('quota_sup').value = ""; document.getElementById('quota_inf').value = "";
                const defaultOp = localStorage.getItem('defaultOperatore'); if(defaultOp) operatoreSelect.value = defaultOp;
                saveBtnText.innerText = "INVIA DATI";
            }
            numUSInModifica = d ? String(d.Numero_US) : null;
            document.getElementById('file_foto').value = ""; renderMedia(); renderChips(); validaNumUS(true);
            modal.style.display = 'flex'; modalContent.style.transform = 'translateY(0)';
        }

        /* VALIDAZIONE NUMERO US (obbligatorio e univoco nello stesso scavo) */
        let numUSInModifica = null;
        function stessoNumUS(a, b) {
            a = String(a).trim(); b = String(b).trim();
            return a !== "" && b !== "" && (a === b || (!isNaN(a) && !isNaN(b) && Number(a) === Number(b)));
        }
        function validaNumUS(live = false) {
            const input = document.getElementById('num_us');
            const err = document.getElementById('num_us_error');
            const val = input.value.trim();
            let msg = "";
            if (!val) {
                if (!live) msg = "Numero US obbligatorio";
            } else if (!(numUSInModifica !== null && stessoNumUS(numUSInModifica, val))) {
                const esiste = databaseLocale.some(u => u.Scavo == path.scavo && stessoNumUS(u.Numero_US, val));
                if (esiste) msg = "US già presente";
            }
            err.innerText = msg;
            err.style.display = msg ? 'block' : 'none';
            input.style.borderColor = msg ? '#ff5252' : '';
            return !msg && val !== "";
        }

        function closeModal() { modalContent.style.transform = 'translateY(100%)'; setTimeout(() => modal.style.display = 'none', 300); }
        async function addRapporto(t) { const n = await customPrompt(`Inserisci il numero dell'US che <b>${t}</b>:`); if(n) { rapportiDati.push({id: Date.now(), tipo: t, num: n}); renderChips(); } }
        function renderChips() { chipsArea.innerHTML = ""; rapportiDati.forEach(r => { const c = document.createElement('div'); c.style="background:var(--primary-pink);padding:5px 10px;border-radius:15px;font-size:11px"; c.innerHTML = `${r.tipo}: ${r.num} <b onclick="removeRapporto(${r.id})" style="color:red;margin-left:5px">✕</b>`; chipsArea.appendChild(c); }); }
        function removeRapporto(id) { rapportiDati = rapportiDati.filter(r => r.id !== id); renderChips(); }
        const toB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.readAsDataURL(f); r.onload = () => res(r.result); r.onerror = e => rej(e); });

        async function salvaDati() {
            if (!validaNumUS()) { document.getElementById('num_us').focus(); return; }
            document.getElementById('loader').style.display = 'flex';
            const btn = document.getElementById('save-btn-text'); btn.innerText = "Invio..."; btn.disabled = true;
            let fileList = [];
            for (const it of filesDaCaricare) {
                const f = await comprimiImmagine(it.file); const b64 = await toB64(f);
                fileList.push({ base64: b64.split(',')[1], type: f.type, name: f.name });
            }

            const p = {
                action: "SAVE_US", scavo: path.scavo, cantiere: path.cantiere, quadrante: path.quadrante,
                numero_us: document.getElementById('num_us').value, tipo_us: document.getElementById('tipo_us').value,
                operatore: document.getElementById('operatore').value, fotoFiles: fileList, rapporti: rapportiDati,
                descrizione: document.getElementById('descrizione').value, interpretazione: document.getElementById('interpretazione').value,
                quota_sup: document.getElementById('quota_sup').value, quota_inf: document.getElementById('quota_inf').value
            };
            
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) })
            .then(() => { showToast("US Salvata!"); btn.disabled = false; closeModal(); caricaDatiDalDatabase(isFromSearch); })
            .catch(() => { showToast("Errore!"); btn.disabled = false; document.getElementById('loader').style.display = 'none'; });
        }

        caricaDatiDalDatabase();
    </script>
</body>
</html>
