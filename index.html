<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>US Digitali - ArcheoApp</title>
    <style>
        :root {
            --primary-pink: #fce4ec;
            --accent-pink: #f06292;
            --dark-text: #4a4a4a;
            --white: #ffffff;
            --bg-color: #fff5f8;
        }

        /* Impedisce il ricaricamento trascinando verso il basso */
        html, body { 
            overscroll-behavior-y: contain; 
            overflow: hidden;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .header-container { width: 100%; max-width: 500px; margin-bottom: 20px; }
        .search-bar { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; background: var(--white); box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 16px; outline: none; box-sizing: border-box; }
        .breadcrumb { margin-top: 15px; font-size: 18px; color: var(--accent-pink); cursor: pointer; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; padding-bottom: 100px; }

        .box {
            background: var(--white); padding: 20px 15px; border-radius: 20px; text-align: center;
            font-weight: 600; cursor: pointer; transition: transform 0.2s; border: 2px solid var(--primary-pink);
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90px; position: relative;
        }

        .delete-btn {
            position: absolute; top: -10px; left: -10px; background: #ff5252; color: white; border-radius: 50%;
            width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; z-index: 10; border: 2px solid white;
        }

        .box:active { transform: scale(0.95); }
        .box-icon { font-size: 24px; margin-bottom: 10px; }

        .fab {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background-color: var(--accent-pink);
            color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 4px 15px rgba(240, 98, 146, 0.4); cursor: pointer; z-index: 999;
        }

        /* MODAL E GESTI */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            display: none; justify-content: center; align-items: flex-end; z-index: 1000;
        }

        .modal-content {
            background: var(--white); width: 100%; max-width: 500px; max-height: 92%;
            border-radius: 30px 30px 0 0; padding: 15px 25px 40px 25px; overflow-y: auto;
            box-sizing: border-box; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative; touch-action: pan-y;
        }

        .drag-handle {
            width: 40px; height: 5px; background: #ddd; border-radius: 3px; margin: 0 auto 15px auto;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: var(--accent-pink); }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--primary-pink); font-size: 16px; box-sizing: border-box; }
        input[readonly] { background-color: #f2f2f2; color: #888; }

        .btn-save { width: 100%; padding: 15px; background: var(--accent-pink); color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; margin-top: 10px; cursor: pointer; }

        /* LOADER */
        .loader-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 60px; height: 60px; border: 6px solid var(--primary-pink); border-top: 6px solid var(--accent-pink); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* NOTIFICHE TOAST */
        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: var(--accent-pink); color: white; padding: 12px 25px;
            border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10001; transition: bottom 0.4s ease; font-weight: bold; text-align: center; min-width: 200px;
        }
        #toast.show { bottom: 40px; }
    </style>
</head>
<body>

    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div style="margin-top: 20px; color: var(--accent-pink); font-weight: bold; font-size: 18px;">Sincronizzazione...</div>
    </div>

    <div id="toast">Messaggio</div>

    <div class="header-container">
        <input type="text" id="search-input" class="search-bar" placeholder="Cerca US..." oninput="cercaUS(this.value)">
        <div id="breadcrumb" class="breadcrumb" onclick="resetNav()">Home</div>
    </div>

    <div id="main-grid" class="grid-container"></div>
    <div id="add-button" class="fab" onclick="handleFabClick()">+</div>

    <div id="form-modal" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-content" id="modal-content">
            <div class="drag-handle"></div>
            <h2 style="text-align:center; color: var(--accent-pink); margin-top:0;">Scheda US</h2>
            
            <div class="form-group">
                <label>Contesto</label>
                <input type="text" id="form-context" readonly>
            </div>

            <div class="form-group">
                <label>Numero US</label>
                <input type="number" id="num_us" placeholder="Es: 100">
            </div>

            <div class="form-group">
                <label>Tipo US</label>
                <select id="tipo_us">
                    <option value="piano">Piano</option>
                    <option value="taglio">Taglio</option>
                    <option value="riempimento">Riempimento</option>
                    <option value="accumulo">Accumulo</option>
                    <option value="installazione">Installazione</option>
                </select>
            </div>

            <div class="form-group">
                <label>Operatore</label>
                <select id="operatore">
                    <option value="Archeologo 1">Archeologo 1</option>
                    <option value="Archeologo 2">Archeologo 2</option>
                </select>
            </div>

            <div class="form-group">
                <label>Foto</label>
                <input type="file" id="file_foto" accept="image/*" style="margin-top: 5px;">
                <img id="preview_foto" src="" style="width: 100%; margin-top: 10px; border-radius: 12px; display: none; border: 1px solid var(--primary-pink);">
            </div>

            <label>Rapporti Stratigrafici</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px;">
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('Copre')">Copre</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('È coperto da')">Coperto_da</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('Taglia')">Taglia</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('È tagliato da')">Tagliato_da</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('Riempie')">Riempie</button>
                <button type="button" class="btn-save" style="font-size:12px; padding:8px;" onclick="addRapporto('È riempito da')">Riempito_da</button>
            </div>
            
            <div id="chips-area" style="display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;"></div>
            <div class="form-group" style="margin-top:15px;">
                <label>Descrizione</label>
                <textarea id="descrizione" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label>Interpretazione</label>
                <textarea id="interpretazione" rows="3"></textarea>
            </div>

            <button class="btn-save" id="save-btn-text" onclick="salvaDati()">INVIA DATI</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:gray; margin-top:15px; cursor:pointer;">Annulla</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwrcw9ubYVb83iuzwCCg5Dsg_Bb6hwktmyaJ2sj5hcxWOZEt4rmA8M884bbaSeNhb8r/exec';

        let dataStruttura = {};
        let currentLevel = "HOME";
        let path = { scavo: "", cantiere: "", quadrante: "" };
        let rapportiDati = [];
        let databaseLocale = [];

        const grid = document.getElementById('main-grid');
        const breadcrumb = document.getElementById('breadcrumb');
        const addButton = document.getElementById('add-button');
        const modal = document.getElementById('form-modal');
        const modalContent = document.getElementById('modal-content');
        const chipsArea = document.getElementById('chips-area');

        // NOTIFICA PERSONALIZZATA
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // GESTIONE SWIPE DOWN PER CHIUDERE IL FORM
        let touchStartY = 0;
        modalContent.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive: true});
        modalContent.addEventListener('touchmove', e => {
            const touchY = e.touches[0].clientY;
            const diff = touchY - touchStartY;
            if (diff > 0 && modalContent.scrollTop <= 0) {
                e.preventDefault();
                modalContent.style.transform = `translateY(${diff}px)`;
            }
        }, {passive: false});
        modalContent.addEventListener('touchend', e => {
            const diff = e.changedTouches[0].clientY - touchStartY;
            if (diff > 150) closeModal();
            else modalContent.style.transform = `translateY(0)`;
        });

        function handleOverlayClick(e) { if(e.target === modal) closeModal(); }

        document.getElementById('file_foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('preview_foto');
            if (file) { preview.src = URL.createObjectURL(file); preview.style.display = 'block'; }
        });

        async function caricaDatiDalDatabase() {
            document.getElementById('loader').style.display = 'flex';
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                databaseLocale = data.us || [];
                if (data.strutturaObj) dataStruttura = data.strutturaObj;
                render(); 
            } catch (e) { showToast("Errore connessione"); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        function salvaStrutturaInCloud() {
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "SAVE_STRUTTURA", struttura: dataStruttura }) });
            showToast("Struttura aggiornata");
        }

        function eliminaUS(numero_us) {
            if(!confirm(`Vuoi davvero eliminare l'US ${numero_us}?`)) return;
            databaseLocale = databaseLocale.filter(us => String(us.Numero_US) !== String(numero_us));
            render();
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "DELETE_US", scavo: path.scavo, cantiere: path.cantiere, quadrante: path.quadrante, numero_us: numero_us }) })
            .then(() => { showToast("US eliminata"); caricaDatiDalDatabase(); });
        }

        function render() {
            grid.innerHTML = "";
            addButton.style.display = "flex"; 

            let bcHTML = `<span onclick="resetNav()" style="text-decoration:underline;">Home</span>`;
            if (path.scavo) bcHTML += ` > <span onclick="selectScavo('${path.scavo}')" style="text-decoration:underline;">${path.scavo}</span>`;
            if (path.cantiere) bcHTML += ` > <span onclick="selectCantiere('${path.cantiere}')" style="text-decoration:underline;">${path.cantiere}</span>`;
            if (path.quadrante && currentLevel === "US_LIST") bcHTML += ` > <b>${path.quadrante}</b>`;
            breadcrumb.innerHTML = bcHTML;

            if (currentLevel === "HOME") {
                Object.keys(dataStruttura).forEach(s => createBox(s, "🏗️", () => selectScavo(s), () => deleteItem(s)));
            } 
            else if (currentLevel === "CANTIERE") {
                Object.keys(dataStruttura[path.scavo] || {}).forEach(c => createBox(c, "🚧", () => selectCantiere(c), () => deleteItem(c)));
            } 
            else if (currentLevel === "QUADRANTE") {
                (dataStruttura[path.scavo][path.cantiere] || []).forEach(q => createBox(q, "🟦", () => { path.quadrante = q; currentLevel = "US_LIST"; render(); }, () => deleteItem(q)));
            }
            else if (currentLevel === "US_LIST") {
                const filtrat = databaseLocale.filter(u => u.Scavo == path.scavo && u.Cantiere == path.cantiere && u.Quadrante == path.quadrante);
                if(filtrat.length === 0) grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;color:gray;'>Nessuna US. Clicca +</p>";
                filtrat.forEach(us => {
                    const div = document.createElement('div'); div.className = 'box'; div.style.height="50px"; div.style.flexDirection="row"; div.style.justifyContent="space-between"; div.style.border="1px dashed var(--accent-pink)";
                    div.innerHTML = `<div class='delete-btn' onclick='event.stopPropagation(); eliminaUS("${us.Numero_US}")'>✕</div><div style='display:flex;align-items:center;gap:10px'><span style='font-size:10px;color:var(--accent-pink);font-weight:bold'>US</span><b>${us.Numero_US}</b></div><small style='color:gray'>${us.Tipo_US}</small>`;
                    div.onclick = () => openForm(us); grid.appendChild(div);
                });
            }
        }

        function createBox(text, icon, onClick, onDelete) {
            const div = document.createElement('div'); div.className = 'box';
            div.innerHTML = `<div class='delete-btn' onclick='event.stopPropagation(); if(confirm("Eliminare ${text}?")) onDelete("${text}")'>✕</div><div class='box-icon'>${icon}</div>${text}`;
            div.onclick = onClick; grid.appendChild(div);
        }

        function cercaUS(q) {
            q = q.trim().toLowerCase(); if(!q) { render(); return; }
            addButton.style.display = "none"; breadcrumb.innerText = "Risultati: " + q; grid.innerHTML = "";
            databaseLocale.filter(u => String(u.Numero_US).includes(q)).forEach(us => {
                const div = document.createElement('div'); div.className = 'box'; div.style.minHeight="60px"; div.style.alignItems="flex-start";
                div.innerHTML = `<div style='width:100%;display:flex;justify-content:space-between'><b>US ${us.Numero_US}</b><small>${us.Tipo_US}</small></div><div style='font-size:10px;color:var(--accent-pink)'>📍 ${us.Scavo} | ${us.Cantiere} | ${us.Quadrante}</div>`;
                div.onclick = () => { path.scavo=us.Scavo; path.cantiere=us.Cantiere; path.quadrante=us.Quadrante; openForm(us); }; grid.appendChild(div);
            });
        }

        // TASTO PIÙ: CREAZIONE IMMEDIATA
        function handleFabClick() {
            if (currentLevel === "US_LIST") { openForm(); return; }
            
            const nuovo = prompt("Inserisci il nome del nuovo elemento:");
            if (!nuovo || nuovo.trim() === "") return;
            const nomePulito = nuovo.trim();

            // 1. AGGIORNA SUBITO I DATI LOCALI (Così non scompaiono!)
            if (currentLevel === "HOME") {
                if(!dataStruttura[nomePulito]) dataStruttura[nomePulito] = {};
            } else if (currentLevel === "CANTIERE") {
                if(!dataStruttura[path.scavo][nomePulito]) dataStruttura[path.scavo][nomePulito] = [];
            } else if (currentLevel === "QUADRANTE") {
                if(!dataStruttura[path.scavo][path.cantiere].includes(nomePulito)) {
                    dataStruttura[path.scavo][path.cantiere].push(nomePulito);
                }
            }
            
            // 2. MOSTRA SUBITO IL RISULTATO
            render(); 
            
            // 3. SALVA IN BACKGROUND (Senza bloccare l'utente)
            fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: "SAVE_STRUTTURA", struttura: dataStruttura }) 
            });
            
            showToast("Creato: " + nomePulito);
        }

        // ELIMINAZIONE IMMEDIATA
        function deleteItem(item) {
            if (!confirm(`Vuoi eliminare definitivamente ${item}?`)) return;

            // 1. RIMUOVI SUBITO DALLA VISIONE LOCALE
            if (currentLevel === "HOME") {
                delete dataStruttura[item];
            } else if (currentLevel === "CANTIERE") {
                delete dataStruttura[path.scavo][item];
            } else if (currentLevel === "QUADRANTE") {
                dataStruttura[path.scavo][path.cantiere] = dataStruttura[path.scavo][path.cantiere].filter(q => q !== item);
            }
            
            // 2. AGGIORNA SUBITO LA GRIGLIA
            render(); 
            
            // 3. SALVA LA CANCELLAZIONE IN CLOUD
            fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: "SAVE_STRUTTURA", struttura: dataStruttura }) 
            });
            
            showToast("Eliminato con successo");
        }

        function selectScavo(s) { path.scavo = s; path.cantiere=""; path.quadrante=""; currentLevel = "CANTIERE"; render(); }
        function selectCantiere(c) { path.cantiere = c; path.quadrante=""; currentLevel = "QUADRANTE"; render(); }
        function resetNav() { path = {scavo:"", cantiere:"", quadrante:""}; currentLevel = "HOME"; render(); caricaDatiDalDatabase(); }

        function openForm(d = null) {
            document.getElementById('form-context').value = `${path.scavo} | ${path.cantiere} | ${path.quadrante}`;
            const preview = document.getElementById('preview_foto');
            const saveBtn = document.getElementById('save-btn-text');
            rapportiDati = [];
            
            if(d) {
                // 1. CARICAMENTO DATI ESISTENTI
                const map = { 
                    "Copre": d.Copre, 
                    "È coperto da": d.Coperto_da, 
                    "Taglia": d.Taglia, 
                    "È tagliato da": d.Tagliato_da, 
                    "Riempie": d.Riempie, 
                    "È riempito da": d.Riempito_da 
                };
                Object.keys(map).forEach(t => { 
                    if(map[t]) map[t].toString().split(',').forEach(n => { 
                        if(n.trim()) rapportiDati.push({id: Math.random(), tipo: t, num: n.trim()}); 
                    })
                });
                
                document.getElementById('num_us').value = d.Numero_US || "";
                document.getElementById('tipo_us').value = (d.Tipo_US || "piano").toLowerCase();
                document.getElementById('descrizione').value = d.Descrizione || "";
                document.getElementById('interpretazione').value = d.Interpretazione || "";
                
                // 2. GESTIONE FOTO (IL FIX)
                let url = d.Link || d.link || d.LINK || d.URL || "";
                if(url && url.length > 10) {
                    if(url.includes("drive.google.com")) {
                        const idMatch = url.match(/[-\w]{25,}/);
                        if(idMatch) {
                            // Usiamo l'ID corretto col simbolo $
                            url = `https://drive.google.com/thumbnail?id=${idMatch[0]}&sz=w1000`;
                        }
                    }
                    preview.src = url;
                    preview.style.display = 'block';
                    preview.style.minHeight = '200px';
                    preview.style.objectFit = 'contain';
                    
                    // Se il link thumbnail fallisce, usa il vecchio "uc" come backup
                    preview.onerror = function() {
                        if(url.includes("thumbnail")) {
                            const idBackup = url.match(/[-\w]{25,}/);
                            this.src = `https://drive.google.com/uc?id=${idBackup[0]}`;
                        }
                    };
                } else {
                    preview.style.display = 'none';
                }
                saveBtn.innerText = "AGGIORNA DATI";

            } else {
                // 3. RESET PER NUOVA US
                document.getElementById('num_us').value = "";
                document.getElementById('descrizione').value = "";
                document.getElementById('interpretazione').value = "";
                preview.style.display = 'none';
                saveBtn.innerText = "INVIA DATI";
            }

            document.getElementById('file_foto').value = ""; 
            renderChips();
            modal.style.display = 'flex'; 
            modalContent.style.transform = 'translateY(0)';
        }
        function closeModal() { modalContent.style.transform = 'translateY(100%)'; setTimeout(() => modal.style.display = 'none', 300); }
        function addRapporto(t) { const n = prompt(`US che ${t}:`); if(n) { rapportiDati.push({id: Date.now(), tipo: t, num: n}); renderChips(); } }
        function renderChips() { chipsArea.innerHTML = ""; rapportiDati.forEach(r => { const c = document.createElement('div'); c.style="background:var(--primary-pink);padding:5px 10px;border-radius:15px;font-size:11px"; c.innerHTML = `${r.tipo}: ${r.num} <b onclick="removeRapporto(${r.id})" style="color:red;margin-left:5px">✕</b>`; chipsArea.appendChild(c); }); }
        function removeRapporto(id) { rapportiDati = rapportiDati.filter(r => r.id !== id); renderChips(); }

        const toB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.readAsDataURL(f); r.onload = () => res(r.result); r.onerror = e => rej(e); });

        async function salvaDati() {
            const btn = document.getElementById('save-btn-text'); btn.innerText = "Invio..."; btn.disabled = true;
            let fileObj = null;
            const fInput = document.getElementById('file_foto');
            if(fInput.files.length > 0) {
                const f = fInput.files[0]; const b64 = await toB64(f);
                fileObj = { base64: b64.split(',')[1], type: f.type };
            }
            const p = {
                action: "SAVE_US", scavo: path.scavo, cantiere: path.cantiere, quadrante: path.quadrante,
                numero_us: document.getElementById('num_us').value, tipo_us: document.getElementById('tipo_us').value,
                operatore: document.getElementById('operatore').value, fotoFile: fileObj, rapporti: rapportiDati,
                descrizione: document.getElementById('descrizione').value, interpretazione: document.getElementById('interpretazione').value
            };
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) })
            .then(() => { showToast("US Salvata!"); btn.disabled = false; closeModal(); caricaDatiDalDatabase(); })
            .catch(() => { showToast("Errore!"); btn.disabled = false; });
        }

        caricaDatiDalDatabase();
    </script>
</body>
</html>
